document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

rde-divisor:var(--gris-100);\n\n  --texto-protagonista:var(--gris-900);\n  --texto-cuerpo:var(--gris-700);\n  --texto-apoyo:var(--gris-500);\n  --texto-metadato:var(--gris-400);\n  --texto-invertido:var(--gris-0);\n\n  --accion-primaria:var(--verde-600);\n  --accion-primaria-presion:var(--verde-700);\n  --accion-primaria-suave:var(--verde-50);\n  --accion-primaria-suave-texto:var(--verde-700);\n  --nav-activo:var(--verde-600);\n  --nav-inactivo:var(--gris-400);\n  --encabezado-fondo:var(--verde-600);\n  --encabezado-texto:var(--gris-0);\n  --encabezado-texto-apoyo:#A7E8CC;\n\n  --negativo:var(--rojo-600);\n  --negativo-fondo:var(--rojo-50);\n  --negativo-borde:var(--rojo-100);\n  --deuda:var(--naranja-600);\n  --deuda-fondo:var(--naranja-50);\n  --aviso:var(--ambar-700);\n  --aviso-fondo:var(--ambar-50);\n  --aviso-borde:var(--ambar-200);\n  --informativo:var(--azul-700);\n  --informativo-fondo:var(--azul-50);\n\n  --overlay:rgba(0,0,0,.4);\n  /* Tarjeta de contraste: el dato protagonista se despega del fondo claro */\n  --superficie-contraste:var(--gris-900);\n  --superficie-contraste-texto:var(--gris-0);\n  --superficie-contraste-etiqueta:var(--verde-300);\n  --toast-fondo:var(--gris-900);\n  --toast-texto:var(--gris-0);\n}\n\n/* ── Modo oscuro — se diseña en paralelo, no como variante ──────────────── */\n.dark{\n  --fondo-app:var(--pizarra-900);\n  --superficie-tarjeta:var(--pizarra-800);\n  --superficie-hundida:var(--pizarra-700);\n  --superficie-barra:var(--pizarra-800);\n  --borde-tarjeta:var(--pizarra-700);\n  --borde-campo:#475569;\n  --borde-divisor:var(--pizarra-700);\n\n  --texto-protagonista:#F1F5F9;\n  --texto-cuerpo:#CBD5E1;\n  --texto-apoyo:#94A3B8;\n  --texto-metadato:#64748B;\n\n  --accion-primaria:var(--verde-500);\n  --accion-primaria-presion:var(--verde-600);\n  --accion-primaria-suave:rgba(10,154,102,.14);\n  --accion-primaria-suave-texto:#4FC298;\n  --superficie-contraste:var(--verde-800);\n  --superficie-contraste-texto:#F1F5F9;\n  --superficie-contraste-etiqueta:var(--verde-200);\n  --nav-activo:#34D399;\n  --nav-inactivo:#64748B;\n  --encabezado-fondo:var(--verde-700);\n  --encabezado-texto-apoyo:#8FD9BC;\n\n  --negativo:var(--rojo-300);\n  --negativo-fondo:rgba(239,68,68,.1);\n  --negativo-borde:rgba(239,68,68,.3);\n  --deuda:var(--naranja-400);\n  --deuda-fondo:rgba(234,88,12,.14);\n  --aviso:var(--ambar-300);\n  --aviso-fondo:rgba(180,83,9,.2);\n  --aviso-borde:rgba(180,83,9,.4);\n  --informativo:var(--azul-300);\n  --informativo-fondo:rgba(29,78,216,.22);\n\n  --metodo-efectivo-bs-bg:rgba(4,135,90,.22);--metodo-efectivo-bs-fg:#6EE7B7;\n  --metodo-pago-movil-bg:rgba(29,78,216,.22);--metodo-pago-movil-fg:#93C5FD;\n  --metodo-biopago-bg:rgba(126,34,206,.22);--metodo-biopago-fg:#D8B4FE;\n  --metodo-tarjeta-bg:rgba(51,65,85,.6);--metodo-tarjeta-fg:#CBD5E1;\n  --metodo-efectivo-usd-bg:rgba(180,83,9,.22);--metodo-efectivo-usd-fg:#FCD34D;\n  --metodo-fiado-bg:rgba(194,65,12,.22);--metodo-fiado-fg:#FDBA74;\n  --metodo-mixto-bg:rgba(67,56,202,.22);--metodo-mixto-fg:#A5B4FC;\n}\n<\u002Fstyle>\n<style>:root{\n  --fuente-ui:Inter,system-ui,-apple-system,BlinkMacSystemFont,sans-serif; /* @kind font */\n  /* Los montos usan la misma familia con cifras tabulares y cero rasurado:\n     los dígitos quedan del mismo ancho y el 0 no se confunde con la O. */\n  --fuente-monto:Inter,system-ui,sans-serif; /* @kind font */\n  --features-monto:\"tnum\" 1,\"zero\" 1,\"cv05\" 1; /* @kind other */\n\n  /* Máximo tres tamaños por pantalla: protagonista, apoyo, metadato. */\n  /* saldo/total de pantalla dedicada */\n  --tam-protagonista-xl:48px; /* @kind font */\n  /* número principal de tarjeta héroe */\n  --tam-protagonista:36px; /* @kind font */\n  /* precio en la fila de producto */\n  --tam-monto-fila:24px; /* @kind font */\n  /* h1 de encabezado */\n  --tam-titulo:20px; /* @kind font */\n  /* h2 de hoja/modal */\n  --tam-subtitulo:18px; /* @kind font */\n  /* input, botón, texto base */\n  --tam-cuerpo:16px; /* @kind font */\n  /* texto secundario */\n  --tam-apoyo:14px; /* @kind font */\n  /* chips, fechas, etiquetas */\n  --tam-metadato:12px; /* @kind font */\n  /* detalle de movimiento */\n  --tam-micro:11px; /* @kind font */\n\n  --peso-regular:400; /* @kind font */\n  --peso-medio:500; /* @kind font */\n  --peso-semibold:600; /* @kind font */\n  --peso-bold:700; /* @kind font */\n  --alto-apretado:1.1; /* @kind font */\n  --alto-titulo:1.25; /* @kind font */\n  --alto-cuerpo:1.45; /* @kind font */\n  --tracking-titulo:-0.02em; /* @kind other */\n  --tracking-etiqueta:0.06em; /* @kind other */\n}\nbody{font-family:var(--fuente-ui);-webkit-font-smoothing:antialiased}\n.caja-monto{font-family:var(--fuente-monto);font-feature-settings:var(--features-monto);font-variant-numeric:tabular-nums slashed-zero}\n<\u002Fstyle>\n<style>:root{\n  --esp-1:4px;--esp-2:8px;--esp-3:12px;--esp-4:16px;--esp-5:20px;--esp-6:24px;--esp-8:32px;--esp-10:40px;\n  /* Ritmo real de la app: 16px de margen de pantalla, 12px entre tarjetas. */\n  --margen-pantalla:16px;\n  --gap-lista:8px;\n  --gap-bloques:16px;\n  --pad-tarjeta:16px;\n  --pad-tarjeta-heroe:20px;\n\n  /* Objetivos de toque — dedo, nunca cursor. */\n  --toque-min:44px;\n  --toque-comodo:48px;\n  --alto-boton:52px;       /* botón de acción principal */\n  --alto-boton-compacto:44px;\n\n  --radio-chip:9999px;\n  --radio-campo:12px;\n  --radio-tarjeta:12px;\n  --radio-tarjeta-grande:16px;\n  --radio-hoja:16px;\n  --radio-marca:24px;\n  /* max-w-lg: la app vive centrada a 512px */\n  --ancho-app:512px; /* @kind spacing */\n}\n<\u002Fstyle>\n<style>:root{\n  /* Sombras bajas y frías: la separación la hace el borde, no el blur. */\n  --sombra-tarjeta:0 1px 2px 0 rgba(0,0,0,.05);\n  --sombra-hoja:0 -8px 24px rgba(0,0,0,.12);\n  --sombra-modal:0 20px 25px -5px rgba(0,0,0,.1),0 8px 10px -6px rgba(0,0,0,.1);\n  --sombra-flotante:0 12px 24px -6px rgba(1,59,40,.35);\n  --sombra-toast:0 10px 15px -3px rgba(0,0,0,.1);\n  --borde-1:1px; /* @kind spacing */\n}\n.dark{\n  --sombra-tarjeta:0 1px 2px 0 rgba(0,0,0,.4);\n  --sombra-modal:0 20px 25px -5px rgba(0,0,0,.5);\n}\n<\u002Fstyle>\n<style>:root{\n  /* Nada se interpone entre el cajero y el cobro: transiciones de estado\n     cortas, sin entradas coreografiadas ni rebotes. */\n  --dur-instante:120ms; /* @kind other */\n  --dur-corta:180ms; /* @kind other */\n  --dur-hoja:220ms; /* @kind other */\n  --curva:cubic-bezier(.2,0,.2,1); /* @kind other */\n  --curva-salida:ease-out; /* @kind other */\n}\n@keyframes cart-pop{0%,100%{transform:scale(1)}40%{transform:scale(1.35)}}\n@keyframes draw-check{from{stroke-dashoffset:30;opacity:0}to{stroke-dashoffset:0;opacity:1}}\n@keyframes caja-pulse{0%,100%{opacity:1}50%{opacity:.45}}\n.caja-cart-pop{animation:cart-pop .35s var(--curva-salida)}\n.caja-check-path{stroke-dasharray:30;stroke-dashoffset:30;animation:draw-check .45s var(--curva-salida) forwards}\n<\u002Fstyle>\n<style>/* Caja usa Inter — la misma familia que declara globals.css en la app real\n   (font-family: Inter, system-ui, ...). El repo no versiona binarios de\n   fuente, así que se sirven los woff2 oficiales de Google Fonts. */\n@font-face{font-family:Inter;font-style:normal;font-weight:400;font-display:swap;src:url(\"81da6a57-7bb0-426f-ae88-702f7d877a20\") format('woff2')}\n@font-face{font-family:Inter;font-style:normal;font-weight:500;font-display:swap;src:url(\"81da6a57-7bb0-426f-ae88-702f7d877a20\") format('woff2')}\n@font-face{font-family:Inter;font-style:normal;font-weight:600;font-display:swap;src:url(\"81da6a57-7bb0-426f-ae88-702f7d877a20\") format('woff2')}\n@font-face{font-family:Inter;font-style:normal;font-weight:700;font-display:swap;src:url(\"81da6a57-7bb0-426f-ae88-702f7d877a20\") format('woff2')}\n@font-face{font-family:Inter;font-style:normal;font-weight:800;font-display:swap;src:url(\"81da6a57-7bb0-426f-ae88-702f7d877a20\") format('woff2')}\n/* cyrillic-ext */\n@font-face {\n  font-family: 'Inter';\n  font-style: normal;\n  font-weight: 400 800;\ 1, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n\n\n:root{\n  /* ── Verde de marca — la única familia cromática de acción ──────────────\n     La app real usa emerald-600 (#059669). El sistema lo redefine un punto\n     más profundo y saturado para pasar 4.5:1 con texto blanco bajo sol. */\n  --verde-50:#E7F6EF;--verde-100:#C6EBDA;--verde-200:#8FD9BC;--verde-300:#4FC298;\n  --verde-400:#18AC79;--verde-500:#0A9A66;--verde-600:#04875A;--verde-700:#036B48;\n  --verde-800:#025337;--verde-900:#013B28;\n\n  /* ── Neutros claros ─────────────────────────────────────────────────── */\n  --gris-0:#FFFFFF;--gris-50:#F9FAFB;--gris-100:#F3F4F6;--gris-200:#E5E7EB;\n  --gris-300:#D1D5DB;--gris-400:#9CA3AF;--gris-500:#6B7280;--gris-600:#4B5563;\n  --gris-700:#374151;--gris-800:#1F2937;--gris-900:#111827;\n\n  /* ── Neutros oscuros (slate real, nunca negro puro) ─────────────────── */\n  --pizarra-700:#334155;--pizarra-750:#293548;--pizarra-800:#1E293B;--pizarra-900:#0F172A;\n\n  /* ── Semánticos — cada uno ya significa algo para el cajero ─────────── */\n  --rojo-50:#FEF2F2;--rojo-100:#FEE2E2;--rojo-500:#EF4444;--rojo-600:#DC2626;--rojo-700:#B91C1C;--rojo-300:#FCA5A5;\n  --naranja-50:#FFF7ED;--naranja-500:#F97316;--naranja-600:#EA580C;--naranja-400:#FB923C;\n  --ambar-50:#FFFBEB;--ambar-100:#FEF3C7;--ambar-200:#FDE68A;--ambar-300:#FCD34D;--ambar-700:#B45309;--ambar-800:#92400E;\n  --azul-50:#EFF6FF;--azul-100:#DBEAFE;--azul-700:#1D4ED8;--azul-300:#93C5FD;\n\n  /* ── Círculos de iniciales (fiado / catálogo) — set intacto de la app ── */\n  --avatar-1:#8B5CF6;--avatar-2:#3B82F6;--avatar-3:#06B6D4;--avatar-4:#14B8A6;\n  --avatar-5:#10B981;--avatar-6:#F59E0B;--avatar-7:#F97316;--avatar-8:#EC4899;\n\n  /* ── Chips por método de pago (valores de resumen/page.tsx) ─────────── */\n  --metodo-efectivo-bs-bg:#D1FAE5;--metodo-efectivo-bs-fg:#047857;\n  --metodo-pago-movil-bg:#DBEAFE;--metodo-pago-movil-fg:#1D4ED8;\n  --metodo-biopago-bg:#F3E8FF;--metodo-biopago-fg:#7E22CE;\n  --metodo-tarjeta-bg:#F1F5F9;--metodo-tarjeta-fg:#334155;\n  --metodo-efectivo-usd-bg:#FEF3C7;--metodo-efectivo-usd-fg:#B45309;\n  --metodo-fiado-bg:#FFEDD5;--metodo-fiado-fg:#C2410C;\n  --metodo-mixto-bg:#E0E7FF;--metodo-mixto-fg:#4338CA;\n\n  /* ── Alias semánticos — modo claro ──────────────────────────────────── */\n  --fondo-app:var(--gris-50);\n  --superficie-tarjeta:var(--gris-0);\n  --superficie-hundida:var(--gris-100);\n  --superficie-barra:var(--gris-0);\n  --borde-tarjeta:var(--gris-100);\n  --borde-campo:var(--gris-200);\n  --borde-divisor:var(--gris-100);\n\n  --texto-protagonista:var(--gris-900);\n  --texto-cuerpo:var(--gris-700);\n  --texto-apoyo:var(--gris-500);\n  --texto-metadato:var(--gris-400);\n  --texto-invertido:var(--gris-0);\n\n  --accion-primaria:var(--verde-600);\n  --accion-primaria-presion:var(--verde-700);\n  --accion-primaria-suave:var(--verde-50);\n  --accion-primaria-suave-texto:var(--verde-700);\n  --nav-activo:var(--verde-600);\n  --nav-inactivo:var(--gris-400);\n  --encabezado-fondo:var(--verde-600);\n  --encabezado-texto:var(--gris-0);\n  --encabezado-texto-apoyo:#A7E8CC;\n\n  --negativo:var(--rojo-600);\n  --negativo-fondo:var(--rojo-50);\n  --negativo-borde:var(--rojo-100);\n  --deuda:var(--naranja-600);\n  --deuda-fondo:var(--naranja-50);\n  --aviso:var(--ambar-700);\n  --aviso-fondo:var(--ambar-50);\n  --aviso-borde:var(--ambar-200);\n  --informativo:var(--azul-700);\n  --informativo-fondo:var(--azul-50);\n\n  --overlay:rgba(0,0,0,.4);\n  /* Tarjeta de contraste: el dato protagonista se despega del fondo claro */\n  --superficie-contraste:var(--gris-900);\n  --superficie-contraste-texto:var(--gris-0);\n  --superficie-contraste-etiqueta:var(--verde-300);\n  --toast-fondo:var(--gris-900);\n  --toast-texto:var(--gris-0);\n}\n\n/* ── Modo oscuro — se diseña en paralelo, no como variante ──────────────── */\n.dark{\n  --fondo-app:var(--pizarra-900);\n  --superficie-tarjeta:var(--pizarra-800);\n  --superficie-hundida:var(--pizarra-700);\n  --superficie-barra:var(--pizarra-800);\n  --borde-tarjeta:var(--pizarra-700);\n  --borde-campo:#475569;\n  --borde-divisor:var(--pizarra-700);\n\n  --texto-protagonista:#F1F5F9;\n  --texto-cuerpo:#CBD5E1;\n  --texto-apoyo:#94A3B8;\n  --texto-metadato:#64748B;\n\n  --accion-primaria:var(--verde-500);\n  --accion-primaria-presion:var(--verde-600);\n  --accion-primaria-suave:rgba(10,154,102,.14);\n  --accion-primaria-suave-texto:#4FC298;\n  --superficie-contraste:var(--verde-800);\n  --superficie-contraste-texto:#F1F5F9;\n  --superficie-contraste-etiqueta:var(--verde-200);\n  --nav-activo:#34D399;\n  --nav-inactivo:#64748B;\n  --encabezado-fondo:var(--verde-700);\n  --encabezado-texto-apoyo:#8FD9BC;\n\n  --negativo:var(--rojo-300);\n  --negativo-fondo:rgba(239,68,68,.1);\n  --negativo-borde:rgba(239,68,68,.3);\n  --deuda:var(--naranja-400);\n  --deuda-fondo:rgba(234,88,12,.14);\n  --aviso:var(--ambar-300);\n  --aviso-fondo:rgba(180,83,9,.2);\n  --aviso-borde:rgba(180,83,9,.4);\n  --informativo:var(--azul-300);\n  --informativo-fondo:rgba(29,78,216,.22);\n\n  --metodo-efectivo-bs-bg:rgba(4,135,90,.22);--metodo-efectivo-bs-fg:#6EE7B7;\n  --metodo-pago-movil-bg:rgba(29,78,216,.22);--metodo-pago-movil-fg:#93C5FD;\n  --metodo-biopago-bg:rgba(126,34,206,.22);--metodo-biopago-fg:#D8B4FE;\n  --metodo-tarjeta-bg:rgba(51,65,85,.6);--metodo-tarjeta-fg:#CBD5E1;\n  --metodo-efectivo-usd-bg:rgba(180,83,9,.22);--metodo-efectivo-usd-fg:#FCD34D;\n  --metodo-fiado-bg:rgba(194,65,12,.22);--metodo-fiado-fg:#FDBA74;\n  --metodo-mixto-bg:rgba(67,56,202,.22);--metodo-mixto-fg:#A5B4FC;\n}\n\n:root{\n  --fuente-ui:Inter,system-ui,-apple-system,BlinkMacSystemFont,sans-serif; /* @kind font */\n  /* Los montos usan la misma familia con cifras tabulares y cero rasurado:\n     los dígitos quedan del mismo ancho y el 0 no se confunde con la O. */\n  --fuente-monto:Inter,system-ui,sans-serif; /* @kind font */\n  --features-monto:\"tnum\" 1,\"zero\" 1,\"cv05\" 1; /* @kind other */\n\n  /* Máximo tres tamaños por pantalla: protagonista, apoyo, metadato. */\n  /* saldo/total de pantalla dedicada */\n  --tam-protagonista-xl:48px; /* @kind font */\n  /* número principal de tarjeta héroe */\n  --tam-protagonista:36px; /* @kind font */\n  /* precio en la fila de producto */\n  --tam-monto-fila:24px; /* @kind font */\n  /* h1 de encabezado */\n  --tam-titulo:20px; /* @kind font */\n  /* h2 de hoja/modal */\n  --tam-subtitulo:18px; /* @kind font */\n  /* input, botón, texto base */\n  --tam-cuerpo:16px; /* @kind font */\n  /* texto secundario */\n  --tam-apoyo:14px; /* @kind font */\n  /* chips, fechas, etiquetas */\n  --tam-metadato:12px; /* @kind font */\n  /* detalle de movimiento */\n  --tam-micro:11px; /* @kind font */\n\n  --peso-regular:400; /* @kind font */\n  --peso-medio:500; /* @kind font */\n  --peso-semibold:600; /* @kind font */\n  --peso-bold:700; /* @kind font */\n  --alto-apretado:1.1; /* @kind font */\n  --alto-titulo:1.25; /* @kind font */\n  --alto-cuerpo:1.45; /* @kind font */\n  --tracking-titulo:-0.02em; /* @kind other */\n  --tracking-etiqueta:0.06em; /* @kind other */\n}\nbody{font-family:var(--fuente-ui);-webkit-font-smoothing:antialiased}\n.caja-monto{font-family:var(--fuente-monto);font-feature-settings:var(--features-monto);font-variant-numeric:tabular-nums slashed-zero}\n\n:root{\n  --esp-1:4px;--esp-2:8px;--esp-3:12px;--esp-4:16px;--esp-5:20px;--esp-6:24px;--esp-8:32px;--esp-10:40px;\n  /* Ritmo real de la app: 16px de margen de pantalla, 12px entre tarjetas. */\n  --margen-pantalla:16px;\n  --gap-lista:8px;\n  --gap-bloques:16px;\n  --pad-tarjeta:16px;\n  --pad-tarjeta-heroe:20px;\n\n  /* Objetivos de toque — dedo, nunca cursor. */\n  --toque-min:44px;\n  --toque-comodo:48px;\n  --alto-boton:52px;       /* botón de acción principal */\n  --alto-boton-compacto:44px;\n\n  --radio-chip:9999px;\n  --radio-campo:12px;\n  --radio-tarjeta:12px;\n  --radio-tarjeta-grande:16px;\n  --radio-hoja:16px;\n  --radio-marca:24px;\n  /* max-w-lg: la app vive centrada a 512px */\n  --ancho-app:512px; /* @kind spacing */\n}\n\n:root{\n  /* Sombras bajas y frías: la separación la hace el borde, no el blur. */\n  --sombra-tarjeta:0 1px 2px 0 rgba(0,0,0,.05);\n  --sombra-hoja:0 -8px 24px rgba(0,0,0,.12);\n  --sombra-modal:0 20px 25px -5px rgba(0,0,0,.1),0 8px 10px -6px rgba(0,0,0,.1);\n  --sombra-flotante:0 12px 24px -6px rgba(1,59,40,.35);\n  --sombra-toast:0 10px 15px -3px rgba(0,0,0,.1);\n  --borde-1:1px; /* @kind spacing */\n}\n.dark{\n  --sombra-tarjeta:0 1px 2px 0 rgba(0,0,0,.4);\n  --sombra-modal:0 20px 25px -5px rgba(0,0,0,.5);\n}\n\n:root{\n  /* Nada se interpone entre el cajero y el cobro: transiciones de estado\n     cortas, sin entradas coreografiadas ni rebotes. */\n  --dur-instante:120ms; /* @kind other */\n  --dur-corta:180ms; /* @kind other */\n  --dur-hoja:220ms; /* @kind other */\n  --curva:cubic-bezier(.2,0,.2,1); /* @kind other */\n  --curva-salida:ease-out; /* @kind other */\n}\n@keyframes cart-pop{0%,100%{transform:scale(1)}40%{transform:scale(1.35)}}\n@keyframes draw-check{from{stroke-dashoffset:30;opacity:0}to{stroke-dashoffset:0;opacity:1}}\n@keyframes caja-pulse{0%,100%{opacity:1}50%{opacity:.45}}\n.caja-cart-pop{animation:cart-pop .35s var(--curva-salida)}\n.caja-check-path{stroke-dasharray:30;stroke-dashoffset:30;animation:draw-check .45s var(--curva-salida) forwards}\n\n<\u002Fstyle>\n<script src=\"a71d6096-9876-430d-bd52-b00766b95d51\"><\u002Fscript>\n<\u002Fhelmet>\n<div style=\"{{ vars }}\" data-screen-label=\"Inventario escritorio\">\n<div style=\"position:relative;display:flex;width:1280px;height:820px;overflow:hidden;background:var(--bg);color:var(--tx1);font-family:Inter,system-ui,sans-serif;font-variant-numeric:tabular-nums slashed-zero;border-radius:16px;border:1px solid var(--bor)\">\n\n<aside style=\"flex:none;width:220px;display:flex;flex-direction:column;gap:18px;padding:18px 14p , { activo: false }),\n].map((p, i) => Object.assign(p, { id: 'i' + i, codigo: p.codigo || 'Sin código' }));\n\nconst NAV = [\n  { id: 'caja', label: 'Caja', icono: 'M9 21a1 1 0 1 1-2 0 1 1 0 0 1 2 0ZM20 21a1 1 0 1 1-2 0 1 1 0 0 1 2 0ZM2.05 2.05h2l2.66 12.42a2 2 0 0 0 2 1.58h9.78a2 2 0 0 0 1.95-1.57l1.65-7.43H5.12' },\n  { id: 'resumen', label: 'Resumen', icono: 'M12 20V10M18 20V4M6 20v-4' },\n  { id: 'fiado', label: 'Fiado', icono: 'M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2M13 11a4 4 0 1 1-8 0 4 4 0 0 1 8 0ZM22 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75' },\n  { id: 'inventario', label: 'Inventario', icono: 'M11 21.73a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73zM12 22V12M3.3 7l8.7 5 8.7-5M7.5 4.27l9 5.15' },\n  { id: 'movimientos', label: 'Movimientos', icono: 'm16 3 4 4-4 4M20 7H4m4 14-4-4 4-4M4 17h16' },\n  { id: 'presupuestos', label: 'Presupuestos', icono: 'M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7l-5-5ZM14 2v4a2 2 0 0 0 2 2h4M10 9H8M16 13H8M16 17H8' },\n  { id: 'reportes', label: 'Reportes', icono: 'M3 3v16a2 2 0 0 0 2 2h16M18 17V9M13 17V5M8 17v-3' },\n  { id: 'tasa', label: 'Tasa', icono: 'M22 12a10 10 0 1 1-20 0 10 10 0 0 1 20 0ZM16 8h-6a2 2 0 1 0 0 4h4a2 2 0 1 1 0 4H8M12 18V6' },\n  { id: 'usuarios', label: 'Usuarios', icono: 'M18 21a8 8 0 0 0-16 0M15 8a5 5 0 1 1-10 0 5 5 0 0 1 10 0ZM22 20c0-3.37-2-6.5-4-8a5 5 0 0 0-.45-8.3' },\n  { id: 'negocio', label: 'Datos del negocio', icono: 'm2 7 4.41-4.41A2 2 0 0 1 7.83 2h8.34a2 2 0 0 1 1.42.59L22 7M4 12v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8M15 22v-4a3 3 0 0 0-3-3 3 3 0 0 0-3 3v4M2 7h20M22 7v3a2 2 0 0 1-2 2 2.7 2.7 0 0 1-1.59-.63.7.7 0 0 0-.82 0A2.7 2.7 0 0 1 16 12a2.7 2.7 0 0 1-1.59-.63.7.7 0 0 0-.82 0A2.7 2.7 0 0 1 12 12a2.7 2.7 0 0 1-1.59-.63.7.7 0 0 0-.82 0A2.7 2.7 0 0 1 8 12a2.7 2.7 0 0 1-1.59-.63.7.7 0 0 0-.82 0A2.7 2.7 0 0 1 4 12a2 2 0 0 1-2-2V7' },\n];\n\nconst TEMAS = {\n  claro: {\n    '--bg': '#F6F7F7', '--sup': '#FFFFFF', '--hund': '#F0F2F1', '--bor': '#E4E7E6',\n    '--tx1': '#111614', '--tx2': '#5C6663', '--tx3': '#98A19E',\n    '--tinta': '#0C1A14', '--tintaBor': '#0C1A14',\n    '--negTenue': '#FEF2F2', '--negBor': '#FADCDC', '--negTx': '#DC2626',\n    '--avisoTenue': '#FFFBEB', '--avisoTx': '#B45309', '--avisoBor': '#FDE68A',\n    '--verdeTenue': '#E7F6EF', '--verdeTx': '#036B48',\n    filaAlerta: '#FFFDF7',\n  },\n  oscuro: {\n    '--bg': '#0B0F0D', '--sup': '#151B18', '--hund': '#1E2622', '--bor': '#2A332E',\n    '--tx1': '#F1F4F2', '--tx2': '#A3ADA8', '--tx3': '#6E7873',\n    '--tinta': '#0C1A14', '--tintaBor': '#3A4842',\n    '--negTenue': 'rgba(220,38,38,.16)', '--negBor': 'rgba(220,38,38,.34)', '--negTx': '#FCA5A5',\n    '--avisoTenue': 'rgba(180,83,9,.22)', '--avisoTx': '#FDE68A', '--avisoBor': 'rgba(180,83,9,.5)',\n    '--verdeTenue': 'rgba(4,135,90,.22)', '--verdeTx': '#E7F6EF',\n    filaAlerta: 'rgba(180,83,9,.07)',\n  },\n};\n\n// Consumo propio se registra como motivo acá, pero en Reportes se cuenta\n// aparte de las mermas: no es pérdida por daño.\nconst MOTIVOS = ['Daño', 'Vencido', 'Pérdida', 'Consumo propio'];\n\nconst fmtBs = n => 'Bs ' + n.toLocaleString('es-VE', { minimumFractionDigits: 2, maximumFractionDigits: 2 });\nconst fmtNum = n => n.toLocaleString('es-VE', { minimumFractionDigits: 2, maximumFractionDigits: 2 });\nconst fmtUsd = n => '$ ' + n.toLocaleString('es-VE', { minimumFractionDigits: 2, maximumFractionDigits: 2 });\nconst usdDe = p => (p.moneda === 'USD' ? p.precio : p.precio / TASA);\nconst rank = p => (!p.activo ? 3 : !p.controla ? 2 : p.stock <= 0 ? 0 : p.stock <= p.umbral ? 1 : 2);\n\nclass Component extends DCLogic {\n  state = { tema: null, chip: null, busqueda: '', col: 'existencia', dir: 'asc', merma: undefined, toast: '' };\n\n  get tema() { return this.state.tema || this.props.tema || 'claro'; }\n  get chip() { return this.state.chip || this.props.chip || 'todos'; }\n  get esAdmin() { return (this.props.rol || 'admin') === 'admin'; }\n  get merma() {\n    if (this.state.merma !== undefined) return this.state.merma;\n    const v = this.props.vista;\n    if (v === 'merma') return { nombre: PRODUCTOS[1].nombre, motivo: 'Vencido', cantidad: 2, nota: '' };\n    if (v === 'merma-peso') {\n      const q = PRODUCTOS.find(x => x.porPeso);\n      return { nombre: q.nombre, motivo: 'Daño', cantidad: 1.5, nota: '' };\n    }\n    return null;\n  }\n\n  abrirMerma(p) {\n    this.setState({ merma: { nombre: p.nombre, motivo: null, cantidad: p.porPeso ? 0.5 : 1, nota: '' } });\n  }\n\n  pasoMerma(signo) {\n    const m = this.merma;\n    if (!m) return;\n    const mp = PRODUCTOS.find(x => x.nombre === m.nombre);\n    const paso = mp && mp.porPeso ? 0.5 : 1;\n    const valor = Math.max(paso, Math.round((m.cantidad + signo * paso) * 100) / 100);\n    this.setState({ merma: Object.assign({}, m, { cantidad: valor }) });\n  }\n\n  avisar(msg) {\n    this.setState({ toast: msg });\n    clearTimeout(this._t);\n    this._t = setTimeout(() => this.setState({ toast: '' }), 2600);\n  }\n\n  componentWillUnmount() { clearTimeout(this._t); }\n\n  ordenarPor(id) {\n    this.setState(s => (s.col === id\n      ? { dir: s.dir === 'asc' ? 'desc' : 'asc' }\n      : { col: id, dir: id === 'producto' ? 'asc' : 'asc' }));\n  }\n\n  renderVals() {\n    const tema = this.tema;\n    const t = TEMAS[tema];\n    const oscuro = tema === 'oscuro';\n    const chipActivo = this.chip;\n    const q = this.state.busqueda.trim().toLowerCase();\n    const col = this.state.col;\n    const dir = this.state.dir;\n    const signo = dir === 'asc' ? 1 : -1;\n\n    const m = this.merma;\n    const mp = m ? PRODUCTOS.find(x => x.nombre === m.nombre) : null;\n    const excedeMerma = !!(m && mp && m.cantidad > (mp.stock || 0));\n    const puedeMermarYa = !!(m && m.motivo && m.cantidad > 0);\n\n    const activos = PRODUCTOS.filter(p => p.activo);\n    const conControl = activos.filter(p => p.controla);\n    const bajos = conControl.filter(p => p.stock > 0 && p.stock <= p.umbral);\n    const ceros = conControl.filter(p => p.stock <= 0);\n    const desactivados = PRODUCTOS.filter(p => !p.activo);\n    const valorUsd = conControl.reduce((s, p) => s + usdDe(p) * (p.stock || 0), 0);\n\n    let visibles = PRODUCTOS.filter(p => {\n      if (chipActivo === 'desactivados') { if (p.activo) return false; }\n      else if (!p.activo) return false;\n      if (chipActivo === 'bajo' && !(p.controla && p.stock > 0 && p.stock <= p.umbral)) return false;\n      if (chipActivo === 'sin' && !(p.controla && p.stock <= 0)) return false;\n      if (q && !(p.nombre.toLowerCase().includes(q) || p.codigo.includes(q))) return false;\n      return true;\n    });\n\n    visibles = visibles.slice().sort((a, b) => {\n      if (col === 'producto') return signo * a.nombre.localeCompare(b.nombre, 'es');\n      if (col === 'precio') return signo * (usdDe(a) - usdDe(b));\n      if (col === 'estado') return signo * (rank(a) - rank(b));\n      if (!a.controla !== !b.controla) return a.controla ? -1 : 1;\n      return signo * ((a.stock || 0) - (b.stock || 0));\n    });\n\n    const COLS = [\n      { id: 'producto', label: 'Producto', justificar: 'flex-start' },\n      { id: 'precio', label: 'Precio', justificar: 'flex-end' },\n      { id: 'existencia', label: 'Existencia', justificar: 'flex-end' },\n      { id: 'estado', label: 'Estado', justificar: 'flex-start' },\n      { id: null, label: '', justificar: 'flex-end' },\n    ];\n\n    return {\n      vars: t,\n      iconoTema: oscuro\n        ? 'M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41M16 12a4 4 0 1 1-8 0 4 4 0 0 1 8 0Z'\n        : 'M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z',\n      temaTexto: oscuro ? 'Modo claro' : 'Modo oscuro',\n      alternarTema: () => this.setState({ tema: oscuro ? 'claro' : 'oscuro' }),\n\n      estadoTexto: oscuro ? 'Sin conexión' : 'En línea',\n      estadoPunto: oscuro ? '#98A19E' : '#04875A',\n      estadoBg: oscuro ? t['--hund'] : t['--verdeTenue'],\n      estadoBor: oscuro ? t['--bor'] : '#CDEADD',\n      estadoTx: oscuro ? t['--tx2'] : t['--verdeTx'],\n\n      nav: NAV.map(n => ({\n        label: n.label,\n        icono: n.icono,\n        bg: n.id === 'inventario' ? t['--verdeTenue'] : 'transparent',\n        color: n.id === 'inventario' ? '#04875A' : t['--tx2'],\n      })),\n\n      subtitulo: '2.514 productos · ' + bajos.length + ' por reponer · ' + ceros.length + ' en cero',\n      valorUsd: fmtUsd(valorUsd),\n      valorBs: fmtBs(valorUsd * TASA),\n      indicadores: [\n        { etiqueta: 'Activos', valor: '2.514', color: t['--tx1'], bor: t['--bor'] },\n        { etiqueta: 'Stock bajo', valor: String(bajos.length), color: oscuro ? '#FDBA74' : '#C2410C', bor: t['--avisoBor'] },\n        { etiqueta: 'En cero', valor: String(ceros.length), color: t['--negTx'], bor: t['--negBor'] },\n      ],\n\n      chips: [\n        { id: 'todos', label: 'Todos', cuenta: '2.514' },\n        { id: 'bajo', label: 'Stock bajo', cuenta: String(bajos.length) },\n        { id: 'sin', label: 'Sin stock', cuenta: String(ceros.length) },\n        { id: 'desactivados', label: 'Desactivados', cuenta: String(desactivados.length) },\n      ].map(c => {\n        const activo = c.id === chipActivo;\n        return {\n          label: c.label,\n          cuenta: c.cuenta,\n          bg: activo ? t['--verdeTenue'] : 'transparent',\n          tx: activo ? t['--verdeTx'] : t['--tx2'],\n          bor: activo ? '#04875A' : t['--bor'],\n          elegir: () => this.setState({ chip: c.id }),\n        };\n      }),\n\n      columnas: COLS.map(c => ({\n        label: c.label,\n        justificar: c.justificar,\n        color: c.id === col ? t['--tx1'] : t['--tx2'],\n        cursor: c.id ? 'pointer' : 'default',\n        flechaOp: c.id === col ? 1 : 0,\n        flechaGiro: c.id === col && dir === 'desc' ? '180deg' : '0deg',\n        ordenar: c.id ? () => this.ordenarPor(c.id) : () => {},\n      })),\n\n      filas: visibles.map(p => {\n        const cero = p.controla && p.stock <= 0;\n        const bajo = p.controla && p.stock > 0 && p.stock <= p.umbral;\n        const pct = !p.controla ? 0 : Math.max(cero ? 0 : 4, Math.min(100, (p.stock / Math.max(p.umbral * 3, 1)) * 100));\n        const estado = !p.activo ? { texto: 'Desactivado', bg: t['--hund'], tx: t['--tx2'] }\n          : !p.controla ? { texto: 'Sin control', bg: t['--hund'], tx: t['--tx2'] }\n          : cero ? { texto: 'En cero', bg: t['--negTenue'], tx: t['--negTx'] }\n          : bajo ? { texto: 'Stock bajo', bg: t['--avisoTenue'], tx: t['--avisoTx'] }\n          : { texto: 'Disponible', bg: t['--verdeTenue'], tx: t['--verdeTx'] };\n        return {\n          nombre: p.nombre,\n          mermar: () => this.abrirMerma(p),\n          sufijo: p.porPeso ? ' / kg' : '',\n          codigo: p.codigo,\n          precioBs: fmtBs(usdDe(p) * TASA),\n          precioUsd: fmtUsd(usdDe(p)),\n          stockTexto: !p.controla ? 'No lleva control' : (p.porPeso ? fmtNum(p.stock) + ' kg' : p.stock + (p.stock === 1 ? ' unidad' : ' unidades')),\n          stockTx: cero ? t['--negTx'] : bajo ? t['--avisoTx'] : t['--tx2'],\n          stockColor: cero ? '#DC2626' : bajo ? '#B45309' : '#04875A',\n          stockPct: pct.toFixed(0) + '%',\n          estado: estado.texto,\n          estadoBg: estado.bg,\n          estadoTx: estado.tx,\n          opacidad: p.activo ? 1 : 0.6,\n          fondo: cero || bajo ? t.filaAlerta : 'transparent',\n        };\n      }),\n\n      puedeMermar: this.esAdmin,\n      hojaMerma: !!m,\n      cerrarMerma: () => this.setState({ merma: null }),\n      mermaNombre: mp ? mp.nombre : '',\n      mermaStock: mp ? (mp.porPeso ? fmtNum(mp.stock) + ' kg' : mp.stock + (mp.stock === 1 ? ' unidad' : ' uds')) : '',\n      motivos: MOTIVOS.map(x => {\n        const act = !!m && m.motivo === x;\n        return {\n          label: x,\n          bg: act ? t['--verdeTenue'] : t['--hund'],\n          tx: act ? t['--verdeTx'] : t['--tx2'],\n          bor: act ? '#04875A' : t['--bor'],\n          elegir: () => this.setState({ merma: Object.assign({}, m, { motivo: x }) }),\n        };\n      }),\n      etiquetaCantidad: mp && mp.porPeso ? 'Cantidad en kilos' : 'Cantidad en unidades',\n      mermaCantidad: m ? (mp && mp.porPeso ? fmtNum(m.cantidad) + ' kg' : String(m.cantidad)) : '',\n      mermaMenos: () => this.pasoMerma(-1),\n      mermaMas: () => this.pasoMerma(1),\n      mermaCampoBor: excedeMerma ? t['--avisoBor'] : t['--bor'],\n      mermaExcede: excedeMerma\n        ? 'Estás registrando más de lo que dice el sistema (' + (mp.porPeso ? fmtNum(mp.stock) + ' kg' : mp.stock + ' uds') + '). Se puede guardar igual: la existencia queda en cero.'\n        : '',\n      mermaNota: m ? m.nota : '',\n      escribirMermaNota: e => this.setState({ merma: Object.assign({}, m, { nota: e.target.value }) }),\n      mermaTexto: !m || !m.motivo ? 'Elige el motivo' : 'Registrar ' + (mp && mp.porPeso ? fmtNum(m.cantidad) + ' kg' : m.cantidad + (m.cantidad === 1 ? ' unidad' : ' uds')),\n      mermaCursor: puedeMermarYa ? 'pointer' : 'not-allowed',\n      mermaOpacidad: puedeMermarYa ? 1 : 0.4,\n      confirmarMerma: () => {\n        if (!puedeMermarYa) return;\n        const etiqueta = mp.porPeso ? fmtNum(m.cantidad) + ' kg' : m.cantidad + (m.cantidad === 1 ? ' unidad' : ' uds');\n        this.setState({ merma: null });\n        this.avisar('Merma registrada · ' + m.motivo + ' · ' + etiqueta);\n      },\n      toast: this.state.toast,\n\n      pieIzquierda: 'Mostrando ' + visibles.length + ' de 2.514 productos',\n      pieDerecha: 'Tocá un encabezado para reordenar',\n\n      busqueda: this.state.busqueda,\n      escribirBusqueda: e => this.setState({ busqueda: e.target.value }),\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
